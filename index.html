<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #050813;
      --bg2: #07101c;
      --panel: rgba(10, 14, 24, 0.76);
      --panel-strong: rgba(9, 13, 22, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.05);
      --text: #f8fbff;
      --muted: #91a3bf;
      --cyan: #73e8ff;
      --violet: #9b84ff;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 15%, rgba(115, 232, 255, 0.10), transparent 26%),
        radial-gradient(circle at 84% 82%, rgba(155, 132, 255, 0.11), transparent 30%),
        linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 4px 4px;
      mask-image: radial-gradient(circle at center, black 34%, transparent 100%);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(110px);
      opacity: 0.18;
      pointer-events: none;
    }

    .orb-a {
      width: 26rem;
      height: 26rem;
      top: -9rem;
      left: -9rem;
      background: #35dcff;
    }

    .orb-b {
      width: 28rem;
      height: 28rem;
      right: -10rem;
      bottom: -11rem;
      background: #7b61ff;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .setup-screen,
    .viewer-screen {
      position: absolute;
      inset: 0;
    }

    .setup-screen {
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .setup-screen.hidden {
      opacity: 0;
      transform: scale(0.985);
      pointer-events: none;
    }

    .setup-card {
      width: min(720px, 100%);
      padding: 34px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(13, 18, 30, 0.88), rgba(7, 10, 18, 0.84));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(115, 232, 255, 0.08);
      border: 1px solid rgba(115, 232, 255, 0.16);
      color: #cff8ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 620px;
    }

    .grid-form {
      margin-top: 28px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .field label {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .field span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .field input {
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(4, 8, 16, 0.92);
      color: var(--text);
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      border-color: rgba(115, 232, 255, 0.68);
      box-shadow: 0 0 0 4px rgba(115, 232, 255, 0.10);
    }

    .generate-btn,
    .ghost-btn {
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    .generate-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
    }

    .generate-btn {
      margin-top: 18px;
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 18px;
      font-weight: 800;
      color: #08111d;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 18px 38px rgba(115, 232, 255, 0.16);
    }

    .viewer-screen {
      z-index: 1;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 52%, rgba(115, 232, 255, 0.05), transparent 30%),
        linear-gradient(180deg, #050914 0%, #04070f 100%);
    }

    .viewer-screen.hidden {
      display: none;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-right {
      display: flex;
      gap: 10px;
    }

    .pill,
    .hint,
    .ghost-btn {
      pointer-events: auto;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      font-weight: 700;
    }

    .hint {
      padding-left: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ghost-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.78);
      color: var(--text);
      backdrop-filter: blur(14px);
    }

    #canvasWrap {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 760px) {
      .field-row {
        grid-template-columns: 1fr;
      }

      .hud {
        flex-wrap: wrap;
      }

      .hud-right {
        width: 100%;
      }

      .ghost-btn {
        flex: 1;
      }

      .setup-card {
        padding: 24px;
      }

      h1 {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="app">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <div class="eyebrow">Spatial Grid Builder</div>
        <h1>Build a true 3D grid.</h1>
        <p class="lead">Choose X, Y, and Z, then generate a real draggable wireframe lattice.</p>

        <form id="gridForm" class="grid-form">
          <div class="field-row">
            <div class="field">
              <label for="xInput">X</label>
              <input id="xInput" type="number" min="1" value="6" />
              <span>Width</span>
            </div>

            <div class="field">
              <label for="yInput">Y</label>
              <input id="yInput" type="number" min="1" value="5" />
              <span>Height</span>
            </div>

            <div class="field">
              <label for="zInput">Z</label>
              <input id="zInput" type="number" min="1" value="4" />
              <span>Depth</span>
            </div>
          </div>

          <button class="generate-btn" type="submit">Generate Grid</button>
        </form>
      </div>
    </section>

    <section id="viewerScreen" class="viewer-screen hidden">
      <div class="hud">
        <div class="hud-left">
          <div class="pill" id="gridStats">6 × 5 × 4</div>
          <div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
        </div>

        <div class="hud-right">
          <button id="resetViewBtn" class="ghost-btn" type="button">Reset View</button>
          <button id="backBtn" class="ghost-btn" type="button">Back</button>
        </div>
      </div>

      <div id="canvasWrap"></div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const setupScreen = document.getElementById("setupScreen");
    const viewerScreen = document.getElementById("viewerScreen");
    const gridForm = document.getElementById("gridForm");
    const xInput = document.getElementById("xInput");
    const yInput = document.getElementById("yInput");
    const zInput = document.getElementById("zInput");
    const gridStats = document.getElementById("gridStats");
    const canvasWrap = document.getElementById("canvasWrap");
    const backBtn = document.getElementById("backBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");

    let renderer;
    let scene;
    let camera;
    let controls;
    let gridGroup = null;
    let floorGroup = null;
    let animationStarted = false;
    let currentDims = { x: 6, y: 5, z: 4 };

    function sanitize(value) {
      const n = Number(value);
      if (Number.isNaN(n) || n < 1) return 1;
      return Math.floor(n);
    }

    function showViewer() {
      setupScreen.classList.add("hidden");
      viewerScreen.classList.remove("hidden");
    }

    function showSetup() {
      viewerScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04070f);
      scene.fog = new THREE.Fog(0x04070f, 18, 70);

      camera = new THREE.PerspectiveCamera(
        45,
        Math.max(canvasWrap.clientWidth, 1) / Math.max(canvasWrap.clientHeight, 1),
        0.1,
        1000
      );
      camera.position.set(10, 8, 12);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(Math.max(canvasWrap.clientWidth, 1), Math.max(canvasWrap.clientHeight, 1));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      canvasWrap.innerHTML = "";
      canvasWrap.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = true;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 0.9;
      controls.panSpeed = 0.8;
      controls.minDistance = 3;
      controls.maxDistance = 120;
      controls.target.set(0, 0, 0);

      const ambient = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambient);

      const keyLight = new THREE.PointLight(0x66e6ff, 18, 100, 2);
      keyLight.position.set(10, 12, 8);
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0x8f7cff, 14, 100, 2);
      fillLight.position.set(-10, -8, -8);
      scene.add(fillLight);

      const topLight = new THREE.DirectionalLight(0xffffff, 0.45);
      topLight.position.set(0, 14, 0);
      scene.add(topLight);

      floorGroup = createFloor();
      scene.add(floorGroup);

      window.addEventListener("resize", onResize);
    }

    function createFloor() {
      const group = new THREE.Group();

      const plane = new THREE.Mesh(
        new THREE.CircleGeometry(16, 64),
        new THREE.MeshBasicMaterial({
          color: 0x0b1220,
          transparent: true,
          opacity: 0.42,
          depthWrite: false
        })
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = -5.5;
      group.add(plane);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(7, 13, 64),
        new THREE.MeshBasicMaterial({
          color: 0x17304a,
          transparent: true,
          opacity: 0.22,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = -5.48;
      group.add(ring);

      return group;
    }

    function createLineSegments(vertices, color, opacity) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity
      });

      return new THREE.LineSegments(geometry, material);
    }

    function disposeGroup(group) {
      group.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach((mat) => mat.dispose());
          } else {
            obj.material.dispose();
          }
        }
      });
    }

    function fitCamera(x, y, z, spacing) {
      const width = Math.max((x - 1) * spacing, 1);
      const height = Math.max((y - 1) * spacing, 1);
      const depth = Math.max((z - 1) * spacing, 1);
      const maxDim = Math.max(width, height, depth);

      camera.position.set(maxDim * 1.7, maxDim * 1.35, maxDim * 1.8);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function buildLattice(x, y, z) {
      if (gridGroup) {
        disposeGroup(gridGroup);
        scene.remove(gridGroup);
      }

      const spacing = 1.45;
      const maxX = (x - 1) * spacing;
      const maxY = (y - 1) * spacing;
      const maxZ = (z - 1) * spacing;

      const innerVertices = [];
      const outerVertices = [];
      const group = new THREE.Group();

      for (let yi = 0; yi < y; yi++) {
        for (let zi = 0; zi < z; zi++) {
          const py = yi * spacing;
          const pz = zi * spacing;
          const target = (
            (yi === 0 || yi === y - 1) &&
            (zi === 0 || zi === z - 1)
          ) ? outerVertices : innerVertices;
          target.push(0, py, pz, maxX, py, pz);
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let zi = 0; zi < z; zi++) {
          const px = xi * spacing;
          const pz = zi * spacing;
          const target = (
            (xi === 0 || xi === x - 1) &&
            (zi === 0 || zi === z - 1)
          ) ? outerVertices : innerVertices;
          target.push(px, 0, pz, px, maxY, pz);
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let yi = 0; yi < y; yi++) {
          const px = xi * spacing;
          const py = yi * spacing;
          const target = (
            (xi === 0 || xi === x - 1) &&
            (yi === 0 || yi === y - 1)
          ) ? outerVertices : innerVertices;
          target.push(px, py, 0, px, py, maxZ);
        }
      }

      const innerLines = createLineSegments(innerVertices, 0x74ddff, 0.26);
      const outerLines = createLineSegments(outerVertices, 0xdbe8ff, 0.72);
      group.add(innerLines);
      group.add(outerLines);

      const boxGeometry = new THREE.BoxGeometry(
        Math.max(maxX, 0.001),
        Math.max(maxY, 0.001),
        Math.max(maxZ, 0.001)
      );
      const edgeGeometry = new THREE.EdgesGeometry(boxGeometry);
      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0xbfd2ff,
        transparent: true,
        opacity: 0.38
      });
      const boxEdges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
      boxEdges.position.set(maxX / 2, maxY / 2, maxZ / 2);
      group.add(boxEdges);

      group.position.set(-maxX / 2, -maxY / 2, -maxZ / 2);

      gridGroup = group;
      scene.add(gridGroup);

      fitCamera(x, y, z, spacing);
      gridStats.textContent = `${x} × ${y} × ${z}`;
    }

    function onResize() {
      if (!renderer || !camera) return;
      const width = Math.max(canvasWrap.clientWidth, 1);
      const height = Math.max(canvasWrap.clientHeight, 1);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    gridForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const x = sanitize(xInput.value);
      const y = sanitize(yInput.value);
      const z = sanitize(zInput.value);

      currentDims = { x, y, z };

      xInput.value = x;
      yInput.value = y;
      zInput.value = z;

      showViewer();

      if (!renderer) {
        initScene();
      } else {
        onResize();
      }

      buildLattice(x, y, z);

      if (!animationStarted) {
        animationStarted = true;
        animate();
      }
    });

    backBtn.addEventListener("click", () => {
      showSetup();
    });

    resetViewBtn.addEventListener("click", () => {
      if (!renderer) return;
      buildLattice(currentDims.x, currentDims.y, currentDims.z);
    });

    viewerScreen.classList.add("hidden");
  </script>
</body>
</html>
