<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(10, 14, 24, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.05);
      --text: #f8fbff;
      --muted: #8ea0bc;
      --accent: #63e6ff;
      --accent-2: #8b7dff;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 18%, rgba(99, 230, 255, 0.10), transparent 24%),
        radial-gradient(circle at 78% 80%, rgba(139, 125, 255, 0.12), transparent 28%),
        linear-gradient(180deg, #050915 0%, #04070f 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 4px 4px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 100%);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(100px);
      opacity: 0.24;
      pointer-events: none;
    }

    .orb-a {
      width: 24rem;
      height: 24rem;
      top: -8rem;
      left: -8rem;
      background: #3fd7ff;
    }

    .orb-b {
      width: 26rem;
      height: 26rem;
      right: -10rem;
      bottom: -10rem;
      background: #7b61ff;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .setup-screen,
    .viewer-screen {
      position: absolute;
      inset: 0;
    }

    .setup-screen {
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .setup-screen.hidden {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
    }

    .setup-card {
      width: min(680px, 100%);
      padding: 34px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(13,18,30,0.86), rgba(7,10,18,0.82));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(99, 230, 255, 0.08);
      border: 1px solid rgba(99, 230, 255, 0.16);
      color: #c8f7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .grid-form {
      margin-top: 28px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-soft);
    }

    .field label {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .field span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .field input {
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(4, 8, 16, 0.9);
      color: var(--text);
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      border-color: rgba(99, 230, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(99, 230, 255, 0.10);
    }

    .generate-btn,
    .ghost-btn {
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    .generate-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
    }

    .generate-btn {
      margin-top: 18px;
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 18px;
      font-weight: 800;
      color: #07111f;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow: 0 18px 38px rgba(99, 230, 255, 0.16);
    }

    .viewer-screen {
      z-index: 1;
    }

    .viewer-screen.hidden {
      display: none;
    }

    .canvas-wrap {
      position: absolute;
      inset: 0;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pill,
    .hint,
    .ghost-btn {
      pointer-events: auto;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(9, 13, 22, 0.78);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      font-weight: 700;
    }

    .hint {
      padding-left: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hud-right {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .ghost-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.78);
      color: var(--text);
      backdrop-filter: blur(14px);
    }

    canvas {
      display: block;
    }

    @media (max-width: 760px) {
      .field-row {
        grid-template-columns: 1fr;
      }

      .hud {
        flex-wrap: wrap;
      }

      .hud-right {
        width: 100%;
      }

      .ghost-btn {
        flex: 1;
      }

      h1 {
        font-size: 2.6rem;
      }

      .setup-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="app-shell">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <div class="eyebrow">Spatial Grid Builder</div>
        <h1>Build a real 3D grid.</h1>
        <p class="lead">
          Choose X, Y, and Z dimensions, then generate a draggable spatial lattice.
        </p>

        <form id="gridForm" class="grid-form">
          <div class="field-row">
            <div class="field">
              <label for="xInput">X</label>
              <input id="xInput" type="number" min="1" value="6" />
              <span>Width</span>
            </div>

            <div class="field">
              <label for="yInput">Y</label>
              <input id="yInput" type="number" min="1" value="5" />
              <span>Height</span>
            </div>

            <div class="field">
              <label for="zInput">Z</label>
              <input id="zInput" type="number" min="1" value="4" />
              <span>Depth</span>
            </div>
          </div>

          <button type="submit" class="generate-btn">Generate Grid</button>
        </form>
      </div>
    </section>

    <section id="viewerScreen" class="viewer-screen hidden">
      <div class="hud">
        <div class="hud-left">
          <div class="pill" id="gridStats">6 × 5 × 4</div>
          <div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
        </div>

        <div class="hud-right">
          <button id="resetViewBtn" class="ghost-btn" type="button">Reset View</button>
          <button id="backBtn" class="ghost-btn" type="button">Back</button>
        </div>
      </div>

      <div id="canvasWrap" class="canvas-wrap"></div>
    </section>
  </main>

  <script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.161.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const setupScreen = document.getElementById("setupScreen");
    const viewerScreen = document.getElementById("viewerScreen");
    const gridForm = document.getElementById("gridForm");
    const canvasWrap = document.getElementById("canvasWrap");
    const gridStats = document.getElementById("gridStats");
    const backBtn = document.getElementById("backBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");

    const xInput = document.getElementById("xInput");
    const yInput = document.getElementById("yInput");
    const zInput = document.getElementById("zInput");

    let scene;
    let camera;
    let renderer;
    let controls;
    let latticeGroup = null;
    let currentDims = { x: 6, y: 5, z: 4 };
    let started = false;

    function sanitize(value) {
      const n = Number(value);
      if (Number.isNaN(n) || n < 1) return 1;
      return Math.floor(n);
    }

    function showViewer() {
      setupScreen.classList.add("hidden");
      viewerScreen.classList.remove("hidden");
    }

    function showSetup() {
      viewerScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04070f);
      scene.fog = new THREE.Fog(0x04070f, 18, 60);

      const width = Math.max(canvasWrap.clientWidth, 1);
      const height = Math.max(canvasWrap.clientHeight, 1);

      camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
      camera.position.set(10, 8, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      canvasWrap.innerHTML = "";
      canvasWrap.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = true;
      controls.minDistance = 4;
      controls.maxDistance = 80;
      controls.rotateSpeed = 0.85;
      controls.zoomSpeed = 0.9;
      controls.panSpeed = 0.8;

      const ambient = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambient);

      const cyanLight = new THREE.PointLight(0x63e6ff, 2.8, 100);
      cyanLight.position.set(8, 10, 8);
      scene.add(cyanLight);

      const violetLight = new THREE.PointLight(0x8b7dff, 2.4, 100);
      violetLight.position.set(-10, -6, -8);
      scene.add(violetLight);

      const topLight = new THREE.DirectionalLight(0xffffff, 0.45);
      topLight.position.set(0, 12, 0);
      scene.add(topLight);

      window.addEventListener("resize", onResize);
    }

    function onResize() {
      if (!renderer || !camera) return;

      const width = Math.max(canvasWrap.clientWidth, 1);
      const height = Math.max(canvasWrap.clientHeight, 1);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function clearGrid() {
      if (!latticeGroup) return;

      while (latticeGroup.children.length > 0) {
        const child = latticeGroup.children[0];
        latticeGroup.remove(child);

        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.dispose());
          } else {
            child.material.dispose();
          }
        }
      }

      scene.remove(latticeGroup);
      latticeGroup = null;
    }

    function createLatticeLines(x, y, z, spacing) {
      const vertices = [];
      const maxX = (x - 1) * spacing;
      const maxY = (y - 1) * spacing;
      const maxZ = (z - 1) * spacing;

      for (let yi = 0; yi < y; yi++) {
        for (let zi = 0; zi < z; zi++) {
          const py = yi * spacing;
          const pz = zi * spacing;
          vertices.push(0, py, pz, maxX, py, pz);
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let zi = 0; zi < z; zi++) {
          const px = xi * spacing;
          const pz = zi * spacing;
          vertices.push(px, 0, pz, px, maxY, pz);
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let yi = 0; yi < y; yi++) {
          const px = xi * spacing;
          const py = yi * spacing;
          vertices.push(px, py, 0, px, py, maxZ);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));

      const material = new THREE.LineBasicMaterial({
        color: 0x7ddfff,
        transparent: true,
        opacity: 0.4
      });

      return new THREE.LineSegments(geometry, material);
    }

    function createPoints(x, y, z, spacing) {
      const positions = [];
      const colors = [];

      for (let xi = 0; xi < x; xi++) {
        for (let yi = 0; yi < y; yi++) {
          for (let zi = 0; zi < z; zi++) {
            positions.push(xi * spacing, yi * spacing, zi * spacing);

            const blend = z <= 1 ? 0 : zi / (z - 1);
            const c1 = new THREE.Color(0x6ee7ff);
            const c2 = new THREE.Color(0xa78bfa);
            const c = c1.clone().lerp(c2, blend);

            colors.push(c.r, c.g, c.b);
          }
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        sizeAttenuation: true
      });

      return new THREE.Points(geometry, material);
    }

    function createBounds(x, y, z, spacing) {
      const width = Math.max((x - 1) * spacing, 0.001);
      const height = Math.max((y - 1) * spacing, 0.001);
      const depth = Math.max((z - 1) * spacing, 0.001);

      const geometry = new THREE.BoxGeometry(width, height, depth);
      const edges = new THREE.EdgesGeometry(geometry);
      const material = new THREE.LineBasicMaterial({
        color: 0xc6d4ff,
        transparent: true,
        opacity: 0.5
      });

      const bounds = new THREE.LineSegments(edges, material);
      bounds.position.set(width / 2, height / 2, depth / 2);
      return bounds;
    }

    function createFloorGlow() {
      const geometry = new THREE.PlaneGeometry(50, 50);
      const material = new THREE.MeshBasicMaterial({
        color: 0x08101d,
        transparent: true,
        opacity: 0.42
      });

      const plane = new THREE.Mesh(geometry, material);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = -2.4;
      return plane;
    }

    function fitCameraToGrid(x, y, z, spacing) {
      const width = Math.max((x - 1) * spacing, 1);
      const height = Math.max((y - 1) * spacing, 1);
      const depth = Math.max((z - 1) * spacing, 1);
      const maxDim = Math.max(width, height, depth);

      camera.position.set(maxDim * 1.6, maxDim * 1.3, maxDim * 1.8);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function buildGrid(x, y, z) {
      clearGrid();

      const spacing = 1.3;
      latticeGroup = new THREE.Group();

      const lines = createLatticeLines(x, y, z, spacing);
      const points = createPoints(x, y, z, spacing);
      const bounds = createBounds(x, y, z, spacing);
      const floor = createFloorGlow();

      latticeGroup.add(floor);
      latticeGroup.add(lines);
      latticeGroup.add(points);
      latticeGroup.add(bounds);

      const width = (x - 1) * spacing;
      const height = (y - 1) * spacing;
      const depth = (z - 1) * spacing;

      latticeGroup.position.set(-width / 2, -height / 2, -depth / 2);

      scene.add(latticeGroup);
      fitCameraToGrid(x, y, z, spacing);
      gridStats.textContent = x + " × " + y + " × " + z;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    gridForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const x = sanitize(xInput.value);
      const y = sanitize(yInput.value);
      const z = sanitize(zInput.value);

      currentDims = { x, y, z };

      xInput.value = x;
      yInput.value = y;
      zInput.value = z;

      showViewer();

      if (!started) {
        initThree();
        animate();
        started = true;
      } else {
        onResize();
      }

      buildGrid(x, y, z);
    });

    backBtn.addEventListener("click", function () {
      showSetup();
    });

    resetViewBtn.addEventListener("click", function () {
      if (!camera) return;
      fitCameraToGrid(currentDims.x, currentDims.y, currentDims.z, 1.3);
    });

    viewerScreen.classList.add("hidden");
  </script>
</body>
</html>
