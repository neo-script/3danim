<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050813;
      --panel: rgba(10, 14, 24, 0.72);
      --border: rgba(255,255,255,0.08);
      --text: #f8fbff;
      --muted: #90a0bb;
      --cyan: #6ce7ff;
      --violet: #9a7cff;
      --line: rgba(125, 223, 255, 0.28);
      --line-strong: rgba(198, 212, 255, 0.42);
      --shadow: 0 30px 80px rgba(0,0,0,0.42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 14%, rgba(108, 231, 255, 0.12), transparent 25%),
        radial-gradient(circle at 80% 84%, rgba(154, 124, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #07101e 0%, #04070f 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 4px 4px;
      mask-image: radial-gradient(circle at center, black 34%, transparent 100%);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(100px);
      opacity: 0.22;
      pointer-events: none;
    }

    .orb-a {
      width: 24rem;
      height: 24rem;
      top: -8rem;
      left: -8rem;
      background: #36d9ff;
    }

    .orb-b {
      width: 26rem;
      height: 26rem;
      right: -8rem;
      bottom: -10rem;
      background: #7b61ff;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .setup-screen,
    .viewer-screen {
      position: absolute;
      inset: 0;
    }

    .setup-screen {
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .setup-screen.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .setup-card {
      width: min(700px, 100%);
      padding: 34px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(13, 18, 30, 0.88), rgba(8, 10, 18, 0.82));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(108, 231, 255, 0.08);
      border: 1px solid rgba(108, 231, 255, 0.18);
      color: #cbf7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 620px;
    }

    .grid-form {
      margin-top: 28px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .field label {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .field span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .field input {
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(5, 8, 16, 0.92);
      color: var(--text);
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      border-color: rgba(108, 231, 255, 0.7);
      box-shadow: 0 0 0 4px rgba(108, 231, 255, 0.10);
    }

    .generate-btn,
    .ghost-btn {
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .generate-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
    }

    .generate-btn {
      margin-top: 18px;
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 18px;
      font-weight: 800;
      color: #08111d;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      box-shadow: 0 18px 38px rgba(108, 231, 255, 0.16);
    }

    .viewer-screen {
      z-index: 1;
      overflow: hidden;
    }

    .viewer-screen.hidden {
      display: none;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-right {
      display: flex;
      gap: 10px;
    }

    .pill,
    .hint,
    .ghost-btn {
      pointer-events: auto;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      font-weight: 700;
    }

    .hint {
      padding-left: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .ghost-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.78);
      color: var(--text);
      backdrop-filter: blur(14px);
    }

    .viewport {
      position: absolute;
      inset: 0;
      perspective: 1400px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .viewport.dragging {
      cursor: grabbing;
    }

    .scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .grid-root {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .floor-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) rotateX(90deg) translateZ(-220px);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(82, 151, 255, 0.16) 0%, rgba(82, 151, 255, 0.07) 28%, rgba(82,151,255,0) 70%);
      filter: blur(14px);
      pointer-events: none;
    }

    .line {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 50%;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(108,231,255,0.10), var(--line), rgba(154,124,255,0.18));
      box-shadow:
        0 0 12px rgba(108, 231, 255, 0.14),
        0 0 24px rgba(154, 124, 255, 0.06);
    }

    .line.boundary {
      background: linear-gradient(90deg, rgba(198,212,255,0.20), var(--line-strong), rgba(198,212,255,0.18));
      box-shadow: 0 0 14px rgba(198,212,255,0.12);
      height: 2.5px;
    }

    .node {
      position: absolute;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #effcff 0%, var(--cyan) 35%, var(--violet) 100%);
      box-shadow:
        0 0 10px rgba(108,231,255,0.45),
        0 0 18px rgba(154,124,255,0.25);
    }

    @media (max-width: 760px) {
      .field-row {
        grid-template-columns: 1fr;
      }

      .hud {
        flex-wrap: wrap;
      }

      .hud-right {
        width: 100%;
      }

      .ghost-btn {
        flex: 1;
      }

      .setup-card {
        padding: 24px;
      }

      h1 {
        font-size: 2.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="app">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <div class="eyebrow">Spatial Grid Builder</div>
        <h1>Build a real 3D grid.</h1>
        <p class="lead">Choose X, Y, and Z, then generate a draggable spatial lattice.</p>

        <form id="gridForm" class="grid-form">
          <div class="field-row">
            <div class="field">
              <label for="xInput">X</label>
              <input id="xInput" type="number" min="1" value="6" />
              <span>Width</span>
            </div>

            <div class="field">
              <label for="yInput">Y</label>
              <input id="yInput" type="number" min="1" value="5" />
              <span>Height</span>
            </div>

            <div class="field">
              <label for="zInput">Z</label>
              <input id="zInput" type="number" min="1" value="4" />
              <span>Depth</span>
            </div>
          </div>

          <button class="generate-btn" type="submit">Generate Grid</button>
        </form>
      </div>
    </section>

    <section id="viewerScreen" class="viewer-screen hidden">
      <div class="hud">
        <div class="hud-left">
          <div class="pill" id="gridStats">6 × 5 × 4</div>
          <div class="hint">Drag to rotate · Scroll to zoom</div>
        </div>
        <div class="hud-right">
          <button id="resetViewBtn" class="ghost-btn" type="button">Reset View</button>
          <button id="backBtn" class="ghost-btn" type="button">Back</button>
        </div>
      </div>

      <div id="viewport" class="viewport">
        <div id="scene" class="scene">
          <div class="floor-glow"></div>
          <div id="gridRoot" class="grid-root"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const setupScreen = document.getElementById("setupScreen");
    const viewerScreen = document.getElementById("viewerScreen");
    const gridForm = document.getElementById("gridForm");
    const xInput = document.getElementById("xInput");
    const yInput = document.getElementById("yInput");
    const zInput = document.getElementById("zInput");
    const gridStats = document.getElementById("gridStats");
    const viewport = document.getElementById("viewport");
    const gridRoot = document.getElementById("gridRoot");
    const backBtn = document.getElementById("backBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");

    let rotationX = -24;
    let rotationY = 34;
    let scale = 1;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let currentDims = { x: 6, y: 5, z: 4 };

    function sanitize(value) {
      const n = Number(value);
      if (Number.isNaN(n) || n < 1) return 1;
      return Math.floor(n);
    }

    function showViewer() {
      setupScreen.classList.add("hidden");
      viewerScreen.classList.remove("hidden");
    }

    function showSetup() {
      viewerScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
    }

    function projectTransform() {
      gridRoot.style.transform =
        `translate3d(-50%, -50%, 0) rotateX(${rotationX}deg) rotateY(${rotationY}deg) scale(${scale})`;
    }

    function makeLine(x, y, z, length, axis, boundary = false) {
      const el = document.createElement("div");
      el.className = boundary ? "line boundary" : "line";

      if (axis === "x") {
        el.style.width = length + "px";
        el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(0deg)`;
      } else if (axis === "y") {
        el.style.width = length + "px";
        el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateZ(90deg)`;
      } else if (axis === "z") {
        el.style.width = length + "px";
        el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(90deg)`;
      }

      return el;
    }

    function makeNode(x, y, z, zi, zMax) {
      const el = document.createElement("div");
      el.className = "node";

      const t = zMax <= 1 ? 0 : zi / (zMax - 1);
      const hue = 190 + t * 60;
      el.style.background = `radial-gradient(circle at 35% 35%, #effcff 0%, hsl(${hue} 100% 72%) 35%, hsl(${hue + 25} 85% 68%) 100%)`;
      el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
      return el;
    }

    function buildGrid(x, y, z) {
      gridRoot.innerHTML = "";

      const spacing = 44;
      const width = (x - 1) * spacing;
      const height = (y - 1) * spacing;
      const depth = (z - 1) * spacing;

      const offsetX = -width / 2;
      const offsetY = -height / 2;
      const offsetZ = -depth / 2;

      const frag = document.createDocumentFragment();

      for (let yi = 0; yi < y; yi++) {
        for (let zi = 0; zi < z; zi++) {
          const boundary = (yi === 0 || yi === y - 1) && (zi === 0 || zi === z - 1);
          frag.appendChild(
            makeLine(offsetX, offsetY + yi * spacing, offsetZ + zi * spacing, width, "x", boundary)
          );
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let zi = 0; zi < z; zi++) {
          const boundary = (xi === 0 || xi === x - 1) && (zi === 0 || zi === z - 1);
          frag.appendChild(
            makeLine(offsetX + xi * spacing, offsetY, offsetZ + zi * spacing, height, "y", boundary)
          );
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let yi = 0; yi < y; yi++) {
          const boundary = (xi === 0 || xi === x - 1) && (yi === 0 || yi === y - 1);
          frag.appendChild(
            makeLine(offsetX + xi * spacing, offsetY + yi * spacing, offsetZ, depth, "z", boundary)
          );
        }
      }

      for (let xi = 0; xi < x; xi++) {
        for (let yi = 0; yi < y; yi++) {
          for (let zi = 0; zi < z; zi++) {
            frag.appendChild(
              makeNode(
                offsetX + xi * spacing,
                offsetY + yi * spacing,
                offsetZ + zi * spacing,
                zi,
                z
              )
            );
          }
        }
      }

      gridRoot.appendChild(frag);
      gridStats.textContent = `${x} × ${y} × ${z}`;

      const maxDim = Math.max(x, y, z);
      scale = Math.max(0.42, Math.min(1.35, 8 / maxDim));
      rotationX = -24;
      rotationY = 34;
      projectTransform();
    }

    gridForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const x = sanitize(xInput.value);
      const y = sanitize(yInput.value);
      const z = sanitize(zInput.value);

      currentDims = { x, y, z };
      xInput.value = x;
      yInput.value = y;
      zInput.value = z;

      buildGrid(x, y, z);
      showViewer();
    });

    backBtn.addEventListener("click", () => {
      showSetup();
    });

    resetViewBtn.addEventListener("click", () => {
      buildGrid(currentDims.x, currentDims.y, currentDims.z);
    });

    viewport.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      viewport.classList.add("dragging");
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      rotationY += dx * 0.45;
      rotationX -= dy * 0.35;
      rotationX = Math.max(-89, Math.min(89, rotationX));
      projectTransform();
    });

    function stopDragging(e) {
      dragging = false;
      viewport.classList.remove("dragging");
      try { viewport.releasePointerCapture(e.pointerId); } catch {}
    }

    viewport.addEventListener("pointerup", stopDragging);
    viewport.addEventListener("pointercancel", stopDragging);
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const next = scale - e.deltaY * 0.001;
      scale = Math.max(0.2, Math.min(2.4, next));
      projectTransform();
    }, { passive: false });

    viewerScreen.classList.add("hidden");
    projectTransform();
  </script>
</body>
</html>
