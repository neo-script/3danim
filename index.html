<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="noise"></div>

  <main class="app-shell">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <div class="eyebrow">Spatial Grid Builder</div>
        <h1>Build a true 3D grid.</h1>
        <p class="lead">
          Choose X, Y, and Z dimensions, then generate a real draggable wireframe lattice.
        </p>

        <form id="gridForm" class="grid-form">
          <div class="field-row">
            <label class="field">
              <span class="field-label">X</span>
              <input id="xInput" type="number" min="1" value="6" />
              <span class="field-meta">Width</span>
            </label>

            <label class="field">
              <span class="field-label">Y</span>
              <input id="yInput" type="number" min="1" value="5" />
              <span class="field-meta">Height</span>
            </label>

            <label class="field">
              <span class="field-label">Z</span>
              <input id="zInput" type="number" min="1" value="4" />
              <span class="field-meta">Depth</span>
            </label>
          </div>

          <button class="generate-btn" type="submit">Generate Grid</button>
        </form>
      </div>
    </section>

    <section id="viewerScreen" class="viewer-screen hidden">
      <div class="hud">
        <div class="hud-left">
          <div class="pill" id="gridStats">6 × 5 × 4</div>
          <div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
        </div>

        <div class="hud-right">
          <button id="resetViewBtn" class="ghost-btn" type="button">Reset View</button>
          <button id="backBtn" class="ghost-btn" type="button">Back</button>
        </div>
      </div>

      <div id="canvasWrap" class="canvas-wrap"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
