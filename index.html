<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="app-shell">
    <section id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <div class="eyebrow">Spatial Grid Builder</div>
        <h1>Build a real 3D grid.</h1>
        <p class="lead">
          Choose X, Y, and Z dimensions, then step into a draggable spatial lattice.
        </p>

        <form id="gridForm" class="grid-form">
          <div class="field-row">
            <div class="field">
              <label for="xInput">X</label>
              <input id="xInput" type="number" min="1" value="6" />
              <span>Width</span>
            </div>

            <div class="field">
              <label for="yInput">Y</label>
              <input id="yInput" type="number" min="1" value="5" />
              <span>Height</span>
            </div>

            <div class="field">
              <label for="zInput">Z</label>
              <input id="zInput" type="number" min="1" value="4" />
              <span>Depth</span>
            </div>
          </div>

          <button type="submit" class="generate-btn">Generate Grid</button>
        </form>
      </div>
    </section>

    <section id="viewerScreen" class="viewer-screen hidden">
      <div class="hud">
        <div class="hud-left">
          <div class="pill" id="gridStats">6 × 5 × 4</div>
          <div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
        </div>
        <button id="resetViewBtn" class="ghost-btn">Reset View</button>
        <button id="backBtn" class="ghost-btn">Back</button>
      </div>

      <div id="canvasWrap" class="canvas-wrap"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
